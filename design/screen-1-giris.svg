<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" font-family="'Archivo','Arial Narrow',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E1526"/><stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="0%" r="70%">
      <stop offset="0" stop-color="#FB923C" stop-opacity="0.14"/><stop offset="1" stop-color="#FB923C" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="390" height="844" fill="url(#bg)"/>
  <rect width="390" height="844" fill="url(#glow)"/>
  <!-- status bar -->
  <rect x="16" y="20" width="358" height="40" rx="12" fill="#121B2E" stroke="#26324D"/>
  <text x="30" y="45" fill="#E8EEF7" font-family="'IBM Plex Mono',monospace" font-size="16" font-weight="600">08:00</text>
  <text x="80" y="45" fill="#8FA0BD" font-size="13">· Nöbet</text>
  <rect x="300" y="30" width="60" height="20" rx="10" fill="none" stroke="#F0616A"/>
  <text x="330" y="44" fill="#F0616A" font-family="'IBM Plex Mono',monospace" font-size="10" font-weight="600" text-anchor="middle">ÇÖKTÜ</text>
  <!-- eyebrow + title -->
  <text x="16" y="96" fill="#FB923C" font-family="'IBM Plex Mono',monospace" font-size="11" letter-spacing="2">YZM301 · SE PRIMER</text>
  <text x="16" y="132" fill="#E8EEF7" font-size="26" font-weight="800">Kişiye uyum sağlayan</text>
  <text x="16" y="162" fill="#E8EEF7" font-size="26" font-weight="800">kitap</text>
  <text x="16" y="190" fill="#FB923C" font-size="18" font-weight="700">bu kez yazılım mühendisi için</text>
  <text x="16" y="220" fill="#8FA0BD" font-size="13" font-family="'IBM Plex Sans',sans-serif">Oyuncu karar verir, uygulama o kararın</text>
  <text x="16" y="238" fill="#8FA0BD" font-size="13" font-family="'IBM Plex Sans',sans-serif">teknik sonucunu gösterir.</text>
  <!-- form card -->
  <rect x="16" y="258" width="358" height="470" rx="16" fill="#121B2E" stroke="#26324D"/>
  <text x="32" y="294" fill="#E8EEF7" font-size="14" font-weight="600" font-family="'IBM Plex Sans',sans-serif">1 · Seviyen</text>
  <rect x="32" y="304" width="106" height="40" rx="10" fill="rgba(251,146,60,0.12)" stroke="#FB923C"/>
  <text x="85" y="329" fill="#E8EEF7" font-size="12" text-anchor="middle" font-family="'IBM Plex Sans',sans-serif">Yeni başladım</text>
  <rect x="146" y="304" width="100" height="40" rx="10" fill="#1A2740" stroke="#26324D"/>
  <text x="196" y="329" fill="#8FA0BD" font-size="12" text-anchor="middle" font-family="'IBM Plex Sans',sans-serif">Orta</text>
  <rect x="254" y="304" width="104" height="40" rx="10" fill="#1A2740" stroke="#26324D"/>
  <text x="306" y="329" fill="#8FA0BD" font-size="12" text-anchor="middle" font-family="'IBM Plex Sans',sans-serif">Deneyimli</text>
  <text x="32" y="384" fill="#E8EEF7" font-size="14" font-weight="600" font-family="'IBM Plex Sans',sans-serif">2 · Rolün</text>
  <g font-family="'IBM Plex Sans',sans-serif" font-size="12" text-anchor="middle">
    <rect x="32" y="394" width="78" height="40" rx="10" fill="rgba(251,146,60,0.12)" stroke="#FB923C"/><text x="71" y="419" fill="#E8EEF7">Backend</text>
    <rect x="118" y="394" width="78" height="40" rx="10" fill="#1A2740" stroke="#26324D"/><text x="157" y="419" fill="#8FA0BD">Frontend</text>
    <rect x="204" y="394" width="78" height="40" rx="10" fill="#1A2740" stroke="#26324D"/><text x="243" y="419" fill="#8FA0BD">Full-stack</text>
    <rect x="290" y="394" width="68" height="40" rx="10" fill="#1A2740" stroke="#26324D"/><text x="324" y="419" fill="#8FA0BD">Öğrenci</text>
  </g>
  <text x="32" y="474" fill="#E8EEF7" font-size="14" font-weight="600" font-family="'IBM Plex Sans',sans-serif">3 · Bu krizden ne öğrenmek istersin?</text>
  <rect x="32" y="484" width="326" height="44" rx="12" fill="#1A2740" stroke="#26324D"/>
  <text x="46" y="511" fill="#64748B" font-size="13" font-family="'IBM Plex Sans',sans-serif">örn. canlıda nasıl sakin kalınır</text>
  <rect x="32" y="560" width="326" height="48" rx="12" fill="#FB923C"/>
  <text x="195" y="590" fill="#1b1206" font-size="15" font-weight="700" text-anchor="middle" font-family="'IBM Plex Sans',sans-serif">Nöbete başla →</text>
  <text x="195" y="700" fill="#64748B" font-size="11" text-anchor="middle" font-family="'IBM Plex Mono',monospace">Her seçim bir durum geçişi.</text>
  <text x="195" y="718" fill="#64748B" font-size="11" text-anchor="middle" font-family="'IBM Plex Mono',monospace">Her son bir kabul kriteri.</text>
  <text x="195" y="770" fill="#FB923C" font-size="11" text-anchor="middle" font-family="'IBM Plex Mono',monospace">— Ekran 1 · Giriş —</text>
</svg>
