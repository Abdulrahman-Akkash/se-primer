<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" font-family="'Archivo','Arial Narrow',sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0E1526"/><stop offset="1" stop-color="#0B1220"/></linearGradient>
  </defs>
  <rect width="390" height="844" fill="url(#bg2)"/>
  <!-- status bar -->
  <rect x="16" y="20" width="358" height="40" rx="12" fill="#121B2E" stroke="#26324D"/>
  <text x="30" y="45" fill="#E8EEF7" font-family="'IBM Plex Mono',monospace" font-size="16" font-weight="600">08:10</text>
  <text x="80" y="45" fill="#8FA0BD" font-size="13">· Karar verildi</text>
  <rect x="296" y="30" width="64" height="20" rx="10" fill="none" stroke="#F6A723"/>
  <text x="328" y="44" fill="#F6A723" font-family="'IBM Plex Mono',monospace" font-size="10" font-weight="600" text-anchor="middle">RİSKLİ</text>
  <!-- progress -->
  <rect x="150" y="74" width="26" height="3" rx="2" fill="#FB923C"/>
  <rect x="182" y="74" width="26" height="3" rx="2" fill="#26324D"/>
  <rect x="214" y="74" width="26" height="3" rx="2" fill="#26324D"/>
  <!-- scene card -->
  <rect x="16" y="90" width="358" height="640" rx="16" fill="#121B2E" stroke="#26324D"/>
  <text x="32" y="120" fill="#FB923C" font-family="'IBM Plex Mono',monospace" font-size="11" letter-spacing="1.5">KRİZ · 08:00</text>
  <text x="32" y="148" fill="#E8EEF7" font-size="18" font-weight="700">08:00 — Randevu sistemi çöktü</text>
  <text x="32" y="174" fill="#E8EEF7" font-size="13" font-family="'IBM Plex Sans',sans-serif">Dün gece yeni sürüm çıktı. 300 hasta</text>
  <text x="32" y="192" fill="#E8EEF7" font-size="13" font-family="'IBM Plex Sans',sans-serif">bekliyor, sistem açılmıyor. Nöbetçi sensin.</text>
  <text x="32" y="222" fill="#2DD4BF" font-family="'IBM Plex Mono',monospace" font-size="11" letter-spacing="1">KARAR 1 · MİMARİ</text>
  <!-- tutor -->
  <rect x="32" y="236" width="326" height="150" rx="14" fill="rgba(45,212,191,0.06)" stroke="#2DD4BF" stroke-dasharray="4 3"/>
  <circle cx="46" cy="258" r="4" fill="#2DD4BF"/>
  <text x="58" y="262" fill="#2DD4BF" font-family="'IBM Plex Mono',monospace" font-size="10" letter-spacing="1">AI TUTOR · CEVABI SÖYLEMEZ, SORAR</text>
  <text x="46" y="288" fill="#E8EEF7" font-size="12.5" font-family="'IBM Plex Sans',sans-serif">Geri dönmeden önce, şemanın değişip</text>
  <text x="46" y="306" fill="#E8EEF7" font-size="12.5" font-family="'IBM Plex Sans',sans-serif">değişmediğini nasıl anlarsın?</text>
  <rect x="46" y="320" width="298" height="26" rx="8" fill="#1A2740" stroke="#26324D"/>
  <text x="58" y="337" fill="#8FA0BD" font-size="11" font-family="'IBM Plex Sans',sans-serif">Migration kayıtlarına bakarım</text>
  <rect x="46" y="352" width="298" height="26" rx="8" fill="#1A2740" stroke="#26324D"/>
  <text x="58" y="369" fill="#8FA0BD" font-size="11" font-family="'IBM Plex Sans',sans-serif">Staging'de denerim</text>
  <!-- choices -->
  <rect x="32" y="400" width="326" height="48" rx="12" fill="#1A2740" stroke="#26324D"/>
  <text x="48" y="429" fill="#FB923C" font-family="'IBM Plex Mono',monospace" font-size="15" font-weight="700">A</text>
  <text x="70" y="429" fill="#E8EEF7" font-size="13" font-family="'IBM Plex Sans',sans-serif">Eski sürüme geri dön (rollback)</text>
  <rect x="32" y="456" width="326" height="48" rx="12" fill="#1A2740" stroke="#26324D"/>
  <text x="48" y="485" fill="#FB923C" font-family="'IBM Plex Mono',monospace" font-size="15" font-weight="700">B</text>
  <text x="70" y="485" fill="#E8EEF7" font-size="13" font-family="'IBM Plex Sans',sans-serif">Canlıda yama yap (hotfix)</text>
  <!-- consequence log -->
  <rect x="32" y="522" width="326" height="150" rx="12" fill="#0A1324" stroke="#26324D"/>
  <text x="46" y="548" fill="#FB923C" font-family="'IBM Plex Mono',monospace" font-size="11">ne oldu ›</text>
  <text x="46" y="566" fill="#E8EEF7" font-family="'IBM Plex Mono',monospace" font-size="10.5">Sistem 08:10'da açıldı — ama gece</text>
  <text x="46" y="582" fill="#E8EEF7" font-family="'IBM Plex Mono',monospace" font-size="10.5">alınan randevular görünmüyor.</text>
  <text x="46" y="610" fill="#FB923C" font-family="'IBM Plex Mono',monospace" font-size="11">neden ›</text>
  <text x="46" y="628" fill="#8FA0BD" font-family="'IBM Plex Mono',monospace" font-size="10.5">Rollback kodu geri aldı, şemayı değil;</text>
  <text x="46" y="644" fill="#8FA0BD" font-family="'IBM Plex Mono',monospace" font-size="10.5">kod ve veritabanı uyumsuz kaldı.</text>
  <text x="195" y="712" fill="#FB923C" font-size="11" text-anchor="middle" font-family="'IBM Plex Mono',monospace">— Ekran 2 · Sahne (karar + sonuç) —</text>
</svg>
