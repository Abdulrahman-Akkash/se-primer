<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" font-family="'Archivo','Arial Narrow',sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0E1526"/><stop offset="1" stop-color="#0B1220"/></linearGradient>
    <radialGradient id="glow3" cx="50%" cy="100%" r="70%"><stop offset="0" stop-color="#2DD4BF" stop-opacity="0.12"/><stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="390" height="844" fill="url(#bg3)"/>
  <rect width="390" height="844" fill="url(#glow3)"/>
  <!-- status bar -->
  <rect x="16" y="20" width="358" height="40" rx="12" fill="#121B2E" stroke="#26324D"/>
  <text x="30" y="45" fill="#E8EEF7" font-family="'IBM Plex Mono',monospace" font-size="16" font-weight="600">08:25</text>
  <text x="80" y="45" fill="#8FA0BD" font-size="13">· Bitti</text>
  <rect x="300" y="30" width="60" height="20" rx="10" fill="none" stroke="#34D399"/>
  <text x="330" y="44" fill="#34D399" font-family="'IBM Plex Mono',monospace" font-size="10" font-weight="600" text-anchor="middle">AYAKTA</text>
  <!-- ending card -->
  <rect x="16" y="78" width="358" height="650" rx="16" fill="#121B2E" stroke="#26324D"/>
  <text x="32" y="112" fill="#34D399" font-family="'IBM Plex Mono',monospace" font-size="11" letter-spacing="1.5">SON A · İYİ</text>
  <text x="32" y="148" fill="#34D399" font-size="24" font-weight="800">08:25 — sistem ayakta,</text>
  <text x="32" y="176" fill="#34D399" font-size="24" font-weight="800">veri güvende.</text>
  <text x="32" y="206" fill="#E8EEF7" font-size="13" font-family="'IBM Plex Sans',sans-serif">Krizi çözdün ve kimsenin kişisel verisini</text>
  <text x="32" y="224" fill="#E8EEF7" font-size="13" font-family="'IBM Plex Sans',sans-serif">riske atmadın. Bu son bir kabul kriterini geçti.</text>
  <!-- criteria -->
  <g font-family="'IBM Plex Sans',sans-serif" font-size="12">
    <rect x="32" y="248" width="326" height="40" rx="10" fill="#1A2740" stroke="rgba(52,211,153,0.35)"/>
    <text x="48" y="273" fill="#34D399" font-family="'IBM Plex Mono',monospace" font-size="14" font-weight="700">✓</text>
    <text x="70" y="273" fill="#E8EEF7">Sistem 08:30'dan önce ayağa kalktı</text>
    <rect x="32" y="296" width="326" height="40" rx="10" fill="#1A2740" stroke="rgba(240,97,106,0.35)"/>
    <text x="48" y="321" fill="#F0616A" font-family="'IBM Plex Mono',monospace" font-size="14" font-weight="700">✕</text>
    <text x="70" y="321" fill="#E8EEF7">Değişiklik geri alınabilirdi</text>
    <rect x="32" y="344" width="326" height="40" rx="10" fill="#1A2740" stroke="rgba(52,211,153,0.35)"/>
    <text x="48" y="369" fill="#34D399" font-family="'IBM Plex Mono',monospace" font-size="14" font-weight="700">✓</text>
    <text x="70" y="369" fill="#E8EEF7">'Çalışıyor' bir kabul kriteriyle kanıtlandı</text>
    <rect x="32" y="392" width="326" height="40" rx="10" fill="#1A2740" stroke="rgba(52,211,153,0.35)"/>
    <text x="48" y="417" fill="#34D399" font-family="'IBM Plex Mono',monospace" font-size="14" font-weight="700">✓</text>
    <text x="70" y="417" fill="#E8EEF7">Kişisel veri KVKK'ya uygun korundu</text>
