  <text x="32" y="470" fill="#8FA0BD" font-family="'IBM Plex Mono',monospace" font-size="11">Yeni başlayan · backend · hedef: "sakin kalmak"</text>
  <rect x="32" y="490" width="326" height="48" rx="12" fill="#FB923C"/>
  <text x="195" y="520" fill="#1b1206" font-size="15" font-weight="700" text-anchor="middle" font-family="'IBM Plex Sans',sans-serif">Yeniden oyna</text>
  <text x="195" y="700" fill="#FB923C" font-size="11" text-anchor="middle" font-family="'IBM Plex Mono',monospace">— Ekran 3 · Son (kabul kriteri) —</text>
